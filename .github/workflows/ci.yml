name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Only the version this deployment actually runs is exercised; widen the matrix
      # once the other versions have been verified locally.
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Shellcheck (client and eval scripts)
        run: shellcheck client/*.sh eval/*.sh eval/qa/*.sh
      - name: Secret scan
        run: pre-commit run --all-files
      - name: Tests
        run: pytest -q
      # The harness itself must not silently break: run it offline on a fixture corpus
      # (stub embeddings) and gate on recall@3, so a regression in metric computation
      # or label loading fails the build without needing a model server.
      - name: Evaluation harness self-check (offline, stub backend)
        run: |
          rm -rf /tmp/eval-fixture
          cp -r eval/fixture /tmp/eval-fixture
          python eval/run_eval.py --rag-dir /tmp/eval-fixture --corpus fixture \
            --golden eval/fixture/golden.jsonl --backend stub --k 3 --min-recall 0.8
      # Same contract for the answer-quality harness: stub chat backends exercise the whole
      # pipeline (retrieval wiring, prompts, verdict parsing, aggregation) offline; the
      # gates catch plumbing regressions, not answer quality.
      - name: QA harness self-check (offline, stub backends)
        run: |
          rm -rf /tmp/qa-fixture
          cp -r eval/qa/fixture /tmp/qa-fixture
          python eval/qa/run_qa_eval.py --rag-dir /tmp/qa-fixture --corpus qa-fixture \
            --golden eval/qa/fixture/golden.jsonl --k 3 --embed-backend stub \
            --answer-backend stub --judge-backend stub --min-accuracy 0.9 --min-citation-validity 0.9
