name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Only the version this deployment actually runs is exercised; widen the matrix
      # once the other versions have been verified locally.
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Shellcheck (client scripts)
        run: shellcheck client/*.sh
      - name: Secret scan
        run: pre-commit run --all-files
      - name: Tests
        run: pytest -q
