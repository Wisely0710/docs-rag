# Tooling configuration only — this repo is a service, not an installable package.
# Runtime dependencies live in requirements.txt / requirements-dev.txt.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
# eval/ is a namespace package (no __init__.py): map every file path to its module name
# from the repo root, so `eval.evalutil` is one module no matter which file imports it.
explicit_package_bases = true
mypy_path = "."
files = [
    "ragconfig.py",
    "corpus.py",
    "indexer.py",
    "searchlib.py",
    "ragquery.py",
    "serve.py",
    "qa/llm.py",
    "qa/answer.py",
    "qa/judge.py",
    "qa/ask.py",
    "eval/evalutil.py",
    "eval/run_eval.py",
    "eval/qa/run_qa_eval.py",
]
ignore_missing_imports = true
